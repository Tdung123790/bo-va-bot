<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập & Đăng ký | Bơ & Bột</title><link rel="stylesheet" href="css/main.css"></head><body data-page="dang-nhap"><div data-include="header"></div><main id="main-content" class="account-page"><section class="account-card"><div class="account-card__intro"><span class="eyebrow">BƠ & BỘT</span><h1>Tài khoản thành viên</h1><p>Đăng nhập để theo dõi đơn bánh và lưu những món bạn yêu thích.</p></div><p class="account-warning">Bản demo: tài khoản và mật khẩu băm SHA-256 chỉ lưu trong trình duyệt. Không dùng mật khẩu thật.</p><p id="login-message" role="status"></p><div class="account-tabs" role="group" aria-label="Chọn hình thức"><button type="button" id="tab-login" aria-pressed="true">Đăng nhập</button><button type="button" id="tab-register" aria-pressed="false">Đăng ký</button></div><form id="account-form"><div id="name-field" hidden><label for="member-name">Họ và tên</label><input id="member-name" autocomplete="name" maxlength="100"></div><label for="member-email">Email</label><input id="member-email" type="email" autocomplete="email" required><label for="member-password">Mật khẩu (ít nhất 8 ký tự khi đăng ký)</label><input id="member-password" type="password" autocomplete="current-password" required><button class="account-button" type="submit" id="auth-submit">Đăng nhập</button></form></section></main><div data-include="footer"></div><script type="module" src="js/core/bootstrap.js"></script><script type="module" src="js/pages/login.js"></script></body></html>
