<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tự Thiết Kế Bánh | Bơ & Bột</title><link rel="stylesheet" href="css/main.css"></head><body data-page="tu-thiet-ke-banh"><div data-include="header"></div><main id="main-content"><section class="inner-hero"><h1>Tự Thiết Kế Bánh</h1><p>Sáng tạo chiếc bánh độc bản mang dấu ấn riêng: chọn kích thước, hương vị, kem phủ và lời chúc.</p></section><section class="custom-layout content-wrap"><form id="custom-form"><fieldset><legend>01 · Kích thước</legend><div id="cake-sizes" class="custom-options"></div></fieldset><fieldset><legend>02 · Cốt bánh</legend><div id="cake-flavors" class="custom-options"></div></fieldset><fieldset><legend>03 · Kem phủ</legend><div id="cake-creams" class="custom-options"></div></fieldset><fieldset><legend>04 · Lời chúc</legend><label for="cake-text">Nội dung viết trên bánh (tối đa 30 ký tự)</label><input id="cake-text" name="text" maxlength="30" placeholder="Happy Birthday..."> <small id="cake-counter">0/30 ký tự</small><label for="cake-font">Font chữ</label><select id="cake-font" name="font"></select><label>Màu chữ</label><div id="cake-colors" class="custom-colors"></div></fieldset></form><aside class="custom-preview"><h2>Thiết kế của bạn</h2><div class="custom-preview__image"><img id="cake-image" src="https://images.unsplash.com/photo-1464305795204-6f5bbfc7fb81?w=1000" alt="Ảnh minh họa bánh để xem trước lời chúc"><span id="cake-preview-text">Bơ & Bột</span></div><p id="cake-flavor-label"></p><dl id="cake-breakdown"></dl><p class="custom-preview__total">Tổng: <strong id="cake-total">0 ₫</strong></p><button id="cake-add" type="button">Hoàn tất & Thêm vào giỏ</button><p id="cake-feedback" role="status"></p></aside></section></main><div data-include="footer"></div><script type="module" src="js/core/bootstrap.js"></script><script type="module" src="js/pages/customize.js"></script></body></html>
